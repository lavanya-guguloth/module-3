<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #todo-list {
      max-width: 600px;
      margin: 20px auto;
      padding: 0;
      list-style: none;
    }
    .todo-item {
      background: #fff;
      margin: 10px 0;
      padding: 15px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .completed {
      text-decoration: line-through;
      color: gray;
    }
    button {
      margin-left: 10px;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .delete-btn {
      background: #e74c3c;
      color: white;
    }
    .toggle-btn {
      background: #3498db;
      color: white;
    }
    #empty-message {
      text-align: center;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Todo Application</h1>
  <ul id="todo-list"></ul>
  <p id="empty-message" style="display:none;">No Todos Available</p>

  <script>
    const API_URL = "https://jsonplaceholder.typicode.com/todos";
    const STORAGE_KEY = "todos";

    // Fetch todos from API and store first 20 in Local Storage
    async function fetchAndStoreTodos() {
      try {
        const response = await fetch(API_URL);
        const todos = await response.json();
        const first20 = todos.slice(0, 20);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(first20));
        renderTodos();
      } catch (error) {
        console.error("Error fetching todos:", error);
      }
    }

    // Get todos from Local Storage
    function getTodos() {
      const todos = localStorage.getItem(STORAGE_KEY);
      return todos ? JSON.parse(todos) : [];
    }

    // Save todos to Local Storage
    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Delete a todo by id
    function deleteTodo(id) {
      let todos = getTodos();
      todos = todos.filter(todo => todo.id !== id);
      saveTodos(todos);
      renderTodos();
    }

    // Toggle completed status
    function toggleTodo(id) {
      let todos = getTodos();
      todos = todos.map(todo => {
        if (todo.id === id) {
          todo.completed = !todo.completed;
        }
        return todo;
      });
      saveTodos(todos);
      renderTodos();
    }

    // Render todos on UI
    function renderTodos() {
      const todoList = document.getElementById("todo-list");
      const emptyMessage = document.getElementById("empty-message");
      todoList.innerHTML = "";

      const todos = getTodos();

      if (todos.length === 0) {
        emptyMessage.style.display = "block";
        return;
      } else {
        emptyMessage.style.display = "none";
      }

      todos.forEach(todo => {
        const li = document.createElement("li");
        li.className = "todo-item";

        const title = document.createElement("span");
        title.textContent = todo.title;
        if (todo.completed) {
          title.classList.add("completed");
        }

        const actions = document.createElement("div");

        const toggleBtn = document.createElement("button");
        toggleBtn.textContent = todo.completed ? "Undo" : "Complete";
        toggleBtn.className = "toggle-btn";
        toggleBtn.onclick = () => toggleTodo(todo.id);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "delete-btn";
        deleteBtn.onclick = () => deleteTodo(todo.id);

        actions.appendChild(toggleBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(title);
        li.appendChild(actions);
        todoList.appendChild(li);
      });
    }

    // Initialize app
    if (!localStorage.getItem(STORAGE_KEY)) {
      fetchAndStoreTodos();
    } else {
      renderTodos();
    }
  </script>
</body>
</html>
