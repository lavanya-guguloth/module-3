<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Management App (Firebase)</title>
  <style>
    :root{--accent:#2b6cb0;--muted:#f3f4f6;--card-shadow:0 6px 18px rgba(15,23,42,0.08)}
    *{box-sizing:border-box}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial; margin:0; background:#fff}
    .app{display:flex;min-height:100vh}
    /* Sidebar */
    .sidebar{width:320px;padding:20px;background:linear-gradient(180deg,#fbfdff,#f7fbff);border-right:1px solid #e6eef7}
    .logo{font-weight:700;font-size:18px;color:var(--accent);margin-bottom:12px}
    form .field{margin-bottom:12px}
    label{display:block;font-size:13px;color:#334155;margin-bottom:6px}
    input[type=text], input[type=number]{width:100%;padding:10px;border:1px solid #e6eef7;border-radius:8px}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:white;cursor:pointer}
    .btn.secondary{background:#e53e3e}
    .main{flex:1;padding:20px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:700px){.grid{grid-template-columns:repeat(1,1fr)} .sidebar{display:none}}
    .card{background:white;border-radius:12px;box-shadow:var(--card-shadow);padding:12px;display:flex;flex-direction:column}
    .cover{height:180px;border-radius:8px;background-size:cover;background-position:center;margin-bottom:12px}
    .title{font-weight:600;margin-bottom:6px}
    .meta{font-size:13px;color:#475569;margin-bottom:8px}
    .price{font-weight:700;margin-bottom:10px}
    .card .actions{margin-top:auto;display:flex;gap:8px}
    .muted{color:#64748b;font-size:13px}
    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.5);display:none;align-items:center;justify-content:center}
    .modal{background:white;padding:18px;border-radius:12px;max-width:480px;width:95%;box-shadow:var(--card-shadow)}
    .row{display:flex;gap:8px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">📚 Book Manager</div>
      <p class="muted">Add a new book to Firestore using the form below.</p>
      <form id="addBookForm">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required />
        </div>
        <div class="field">
          <label for="author">Author</label>
          <input id="author" name="author" type="text" required />
        </div>
        <div class="field">
          <label for="price">Price (INR)</label>
          <input id="price" name="price" type="number" step="0.01" required />
        </div>
        <div class="field">
          <label for="image">Cover Image URL</label>
          <input id="image" name="image" type="text" placeholder="https://..." required />
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" type="submit">Add Book</button>
          <button id="seedBtn" type="button" class="btn" style="background:#10b981">Seed (if empty)</button>
        </div>
        <p id="status" class="muted" style="margin-top:10px"></p>
      </form>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2>Books</h2>
        <div class="muted">Realtime synced with Firebase</div>
      </div>

      <div id="booksGrid" class="grid"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div id="modalContent"></div>
      <div style="text-align:right;margin-top:12px">
        <button id="closeModal" class="btn" style="background:#64748b">Close</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <!-- Replace with latest compat versions if desired -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <script>
    // ======== CONFIGURE FIREBASE ========
    // 1) Create a Firebase project in the Firebase console
    // 2) Add a Web App and copy the firebaseConfig object below
    // 3) Enable Firestore (in test mode while developing)

    const firebaseConfig = {
      apiKey: "REPLACE_WITH_YOUR_API_KEY",
      authDomain: "REPLACE_WITH_YOUR_AUTH_DOMAIN",
      projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
      storageBucket: "REPLACE_WITH_YOUR_STORAGE_BUCKET",
      messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
      appId: "REPLACE_WITH_YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // DOM refs
    const booksGrid = document.getElementById('booksGrid');
    const addBookForm = document.getElementById('addBookForm');
    const statusP = document.getElementById('status');
    const seedBtn = document.getElementById('seedBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalContent = document.getElementById('modalContent');
    const closeModal = document.getElementById('closeModal');

    // Render helpers
    function createCard(id, data){
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.id = id;

      const cover = document.createElement('div');
      cover.className = 'cover';
      cover.style.backgroundImage = `url('${data.coverImageURL || ''}')`;
      div.appendChild(cover);

      const t = document.createElement('div'); t.className='title'; t.textContent = data.title || 'Untitled'; div.appendChild(t);
      const m = document.createElement('div'); m.className='meta'; m.textContent = `by ${data.author || 'Unknown'}`; div.appendChild(m);
      const p = document.createElement('div'); p.className='price'; p.textContent = `₹ ${Number(data.price || 0).toFixed(2)}`; div.appendChild(p);

      const actions = document.createElement('div'); actions.className='actions';

      const viewBtn = document.createElement('button'); viewBtn.className='btn'; viewBtn.textContent='View Details';
      viewBtn.onclick = ()=> openModal(id,data);

      const updBtn = document.createElement('button'); updBtn.className='btn'; updBtn.textContent='Update Author';
      updBtn.onclick = ()=> updateAuthor(id,data.author);

      const delBtn = document.createElement('button'); delBtn.className='btn secondary'; delBtn.textContent='Delete';
      delBtn.onclick = ()=> deleteBook(id);

      actions.appendChild(viewBtn); actions.appendChild(updBtn); actions.appendChild(delBtn);
      div.appendChild(actions);
      return div;
    }

    function renderBooks(snapshot){
      booksGrid.innerHTML = '';
      if (snapshot.size === 0){
        booksGrid.innerHTML = '<div class="muted">No books found. Use the form to add one or click Seed.</div>';
        return;
      }
      snapshot.forEach(doc=>{
        const el = createCard(doc.id, doc.data());
        booksGrid.appendChild(el);
      })
    }

    // Realtime listener
    db.collection('books').orderBy('title').onSnapshot(snapshot=>{
      renderBooks(snapshot);
    }, err=>{
      console.error('Listener error', err);
      statusP.textContent = 'Error connecting to Firestore. Check console.';
    });

    // Add book
    addBookForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const title = addBookForm.title.value.trim();
      const author = addBookForm.author.value.trim();
      const price = parseFloat(addBookForm.price.value) || 0;
      const image = addBookForm.image.value.trim();
      statusP.textContent = 'Adding...';
      try{
        await db.collection('books').add({title, author, price, coverImageURL:image});
        statusP.textContent = 'Book added.';
        addBookForm.reset();
      }catch(err){
        console.error(err);
        statusP.textContent = 'Failed to add book. See console.';
      }
      setTimeout(()=>{statusP.textContent=''},2000);
    });

    // Update author
    async function updateAuthor(id, currentAuthor){
      const newAuthor = prompt('Enter new author name:', currentAuthor || '');
      if (newAuthor === null) return; // cancelled
      const trimmed = newAuthor.trim();
      if (trimmed === ''){ alert('Author name cannot be empty'); return; }
      try{
        await db.collection('books').doc(id).update({author: trimmed});
      }catch(err){console.error(err);alert('Failed to update. See console.');}
    }

    // Delete
    async function deleteBook(id){
      if (!confirm('Delete this book?')) return;
      try{
        await db.collection('books').doc(id).delete();
      }catch(err){console.error(err);alert('Failed to delete. See console.');}
    }

    // Modal
    function openModal(id,data){
      modalContent.innerHTML = `
        <h3 style="margin-top:0">${escapeHtml(data.title || 'Untitled')}</h3>
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div style="flex:0 0 120px">
            <img src="${escapeHtml(data.coverImageURL || '')}" alt="cover" style="width:120px;height:160px;object-fit:cover;border-radius:8px"/>
          </div>
          <div style="flex:1">
            <p><strong>Author:</strong> ${escapeHtml(data.author || 'Unknown')}</p>
            <p><strong>Price:</strong> ₹ ${Number(data.price || 0).toFixed(2)}</p>
            <p style="margin-top:8px" class="muted">Document ID: ${escapeHtml(id)}</p>
          </div>
        </div>
      `;
      modalBackdrop.style.display = 'flex';
    }
    closeModal.onclick = ()=>{ modalBackdrop.style.display='none'; }
    modalBackdrop.onclick = (e)=>{ if (e.target === modalBackdrop) modalBackdrop.style.display='none'; }

    // Utility to escape HTML for modal
    function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    // Seed data if empty
    const seedData = [
      { title: 'Atomic Habits', author: 'James Clear', price: 499.00, coverImageURL: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=800&q=60' },
      { title: 'The Alchemist', author: 'Paulo Coelho', price: 299.50, coverImageURL: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=60' },
      { title: 'Clean Code', author: 'Robert C. Martin', price: 799.00, coverImageURL: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=800&q=60' },
      { title: 'Deep Work', author: 'Cal Newport', price: 399.00, coverImageURL: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=60' },
      { title: 'You Don\'t Know JS', author: 'Kyle Simpson', price: 599.00, coverImageURL: 'https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=800&q=60' }
    ];

    seedBtn.addEventListener('click', async ()=>{
      statusP.textContent = 'Seeding...';
      try{
        const snap = await db.collection('books').limit(1).get();
        if (!snap.empty){ statusP.textContent = 'Collection already has documents. Seeding skipped.'; setTimeout(()=>statusP.textContent='',2000); return; }
        const batch = db.batch();
        seedData.forEach(item=>{
          const docRef = db.collection('books').doc();
          batch.set(docRef, item);
        });
        await batch.commit();
        statusP.textContent = 'Seeded demo books.';
      }catch(err){console.error(err);statusP.textContent='Seed failed. See console.'}
      setTimeout(()=>statusP.textContent='',2000);
    });

    // On load, nothing else required - realtime listener will show books
  </script>
</body>
</html>
